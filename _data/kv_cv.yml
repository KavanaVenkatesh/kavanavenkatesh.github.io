name: Kavana Venkatesh
role: Ph.D. Researcher in Computer Science
institution: Virginia Tech
research_statement: I study how language-model agents coordinate, adapt, and sometimes fail together. My research
  focuses on safer multi-agent systems, emergent collective behavior, and reliable agent evaluation. I also work
  on generative vision and creative image modeling.
focus:
- title: Multi-agent safety
  description: Online monitoring, cascading failures, attribution, and intervention in LLM agent systems.
- title: Collective intelligence
  description: Coordination, emergent influence, and scalable agent-based modeling.
- title: Generative models
  description: Diffusion and flow-based methods for creative image generation and editing.
